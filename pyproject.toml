[project]
name = "planetcreator"
version = "0.0.1"
description = "Neural planetary terrain generator trained on Earth elevation + satellite imagery"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
    "rasterio",
    "xarray",
    "netCDF4",
    "requests",
    "pillow",
    "tqdm",
    "numba>=0.67.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planetcreator"]
